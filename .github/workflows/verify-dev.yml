name: Verify dev hub package

# Installs aux4/computer-linux from the DEV hub (not the working copy), sets up a live X11 desktop
# (Xvfb/openbox/dbus/AT-SPI), then runs ci/verify-dev/*.test.md via `aux4 test run`: info (version),
# the core's providers check, a background click through the provider, the same through the core's
# OS dispatch, OCR, and the core's conformance suite against the installed package.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Expected version (empty = whatever the dev hub serves as latest)'
        required: false
        default: ''

jobs:
  verify-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEV_REGISTRY: https://dev.api.hub.aux4.io/v1/packages
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install the desktop, apps and Tesseract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb x11-utils openbox dbus-x11 at-spi2-core \
            libatk-adaptor libgail-common gsettings-desktop-schemas dconf-cli galculator \
            tesseract-ocr tesseract-ocr-eng fonts-dejavu-core jq > /dev/null

      - name: Install aux4 CLI
        run: |
          curl -fsSL https://aux4.sh | sh
          export PATH="$HOME/.aux4.config/packages/aux4/aux4:$PATH"
          echo "$HOME/.aux4.config/packages/aux4/aux4" >> "$GITHUB_PATH"
          curl -fsSL https://pkger.aux4.sh | sh
          aux4 aux4 pkger --help > /dev/null
          npm install -g jest > /dev/null
          aux4 aux4 pkger install aux4/test

      - name: Install aux4/computer-linux from the dev hub
        run: |
          AUX4_REGISTRY_URL="$DEV_REGISTRY" aux4 aux4 pkger install aux4/computer-linux
          aux4 aux4 pkger list | grep -E 'aux4/computer'

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp > /tmp/xvfb.log 2>&1 &
          for i in $(seq 1 50); do DISPLAY=:99 xdpyinfo > /dev/null 2>&1 && break; sleep 0.1; done

      - name: Start the D-Bus session bus
        run: eval "$(dbus-launch --sh-syntax)" && echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"

      - name: Enable toolkit accessibility
        env:
          DISPLAY: ':99'
        run: gsettings set org.gnome.desktop.interface toolkit-accessibility true || true

      - name: Enable the AT-SPI bus
        run: |
          dbus-send --session --dest=org.a11y.Bus --print-reply /org/a11y/bus org.freedesktop.DBus.Properties.Set \
            string:org.a11y.Status string:IsEnabled variant:boolean:true > /dev/null || true

      - name: Start openbox
        env:
          DISPLAY: ':99'
        run: openbox > /tmp/openbox.log 2>&1 & sleep 1

      - name: Export the desktop session env
        run: |
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "GTK_MODULES=gail:atk-bridge" >> "$GITHUB_ENV"
          echo "NO_AT_BRIDGE=0" >> "$GITHUB_ENV"
          echo "XDG_STATE_HOME=$RUNNER_TEMP/state" >> "$GITHUB_ENV"

      - name: Verify the dev-hub install (info/providers/clicks/wait/ocr/conformance)
        run: aux4 test run --dir ci/verify-dev
