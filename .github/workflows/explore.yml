name: Explore
on:
  push:
    branches: [explore]
jobs:
  explore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
      - name: Install desktop
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb x11-utils openbox dbus-x11 at-spi2-core libatk-adaptor libgail-common gsettings-desktop-schemas dconf-cli galculator mousepad tesseract-ocr tesseract-ocr-eng xdotool fonts-dejavu-core > /dev/null
      - name: Install aux4
        run: |
          curl -fsSL https://aux4.sh | sh
          echo "$HOME/.aux4.config/packages/aux4/aux4" >> "$GITHUB_PATH"
      - name: Build
        run: |
          CGO_ENABLED=0 go build -o package/aux4-computer-linux .
          go test ./...
      - name: Session
        run: bash ci/session.sh
      - name: Explore
        run: mkdir -p /tmp/shots && bash ci/explore.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: /tmp/shots
