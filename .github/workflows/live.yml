name: Live UI test

# Drives real GTK apps (galculator, mousepad) on a headless X11 desktop: Xvfb + openbox + a D-Bus
# session with the AT-SPI accessibility bus. Then runs aux4/computer's provider conformance suite.
# Called by ci.yml on branches and by publish.yml before publishing.
on:
  workflow_call:

jobs:
  test-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # aux4/computer (the core this provider depends on) installs from the dev hub until it is promoted
      AUX4_DEV_REGISTRY: https://dev.api.hub.aux4.io/v1/packages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Install the desktop, apps and Tesseract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb x11-utils openbox dbus-x11 at-spi2-core \
            libatk-adaptor libgail-common gsettings-desktop-schemas dconf-cli galculator mousepad \
            tesseract-ocr tesseract-ocr-eng fonts-dejavu-core jq > /dev/null

      - name: Install aux4 CLI
        run: |
          curl -fsSL https://aux4.sh | sh
          export PATH="$HOME/.aux4.config/packages/aux4/aux4:$PATH"
          echo "$HOME/.aux4.config/packages/aux4/aux4" >> "$GITHUB_PATH"
          curl -fsSL https://pkger.aux4.sh | sh
          aux4 aux4 pkger --help > /dev/null

      # Run from package/ so aux4 loads the package's own .aux4 (no install needed).
      - name: Build
        run: CGO_ENABLED=0 go build -o package/aux4-computer-linux .

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp > /tmp/xvfb.log 2>&1 &
          for i in $(seq 1 50); do DISPLAY=:99 xdpyinfo > /dev/null 2>&1 && break; sleep 0.1; done

      - name: Start the D-Bus session bus
        run: eval "$(dbus-launch --sh-syntax)" && echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"

      - name: Enable toolkit accessibility
        env:
          DISPLAY: ':99'
        run: gsettings set org.gnome.desktop.interface toolkit-accessibility true || true

      - name: Enable the AT-SPI bus
        run: |
          dbus-send --session --dest=org.a11y.Bus --print-reply /org/a11y/bus org.freedesktop.DBus.Properties.Set \
            string:org.a11y.Status string:IsEnabled variant:boolean:true > /dev/null || true

      - name: Start openbox
        env:
          DISPLAY: ':99'
        run: openbox > /tmp/openbox.log 2>&1 & sleep 1

      - name: Export the desktop session env
        run: |
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "GTK_MODULES=gail:atk-bridge" >> "$GITHUB_ENV"
          echo "NO_AT_BRIDGE=0" >> "$GITHUB_ENV"
          echo "XDG_STATE_HOME=$RUNNER_TEMP/state" >> "$GITHUB_ENV"

      - name: Install aux4/test
        run: |
          npm install -g jest > /dev/null
          aux4 aux4 pkger install aux4/test

      - name: Live UI test (galculator + mousepad)
        working-directory: package
        run: aux4 test run --dir test-live

      - name: Install aux4/computer
        working-directory: package
        run: AUX4_REGISTRY_URL="$AUX4_DEV_REGISTRY" aux4 aux4 pkger install aux4/computer

      - name: Conformance (aux4/computer provider contract)
        working-directory: package
        run: aux4 computer conformance --provider linux

      - name: Capture screenshots
        if: always()
        working-directory: package
        run: |
          mkdir -p "$RUNNER_TEMP/live/screenshots"
          aux4 computer linux screenshot --output "$RUNNER_TEMP/live/screenshots/final.png" || true

      - name: Upload screenshots and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ui
          path: ${{ runner.temp }}/live
          if-no-files-found: warn
