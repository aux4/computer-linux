name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Lint
        uses: aux4/action@v1
        with:
          command: lint
          strict: 'true'

  test:
    uses: ./.github/workflows/test.yml

  test-live:
    needs: [lint]
    uses: ./.github/workflows/live.yml
